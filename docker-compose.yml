# Local feature-flag backends for this demo, selected via Compose profiles:
#   docker compose --profile flipt up
#   docker compose --profile flagsmith up
#   docker compose --profile unleash up
# (see the Makefile for shortcuts: make flipt-start / fs-start / ul-start)
services:
  # --- Flipt -----------------------------------------------------------
  flipt:
    profiles: ["flipt"]
    image: flipt/flipt:latest
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./flipt:/data
    environment:
      - FLIPT_GIT_POLL_INTERVAL=5s
      - FLIPT_STORAGE_TYPE=local
      - FLIPT_STORAGE_LOCAL_PATH=/data

  # --- Flagsmith ---------------------------------------------------------
  flagsmith-postgres:
    profiles: ["flagsmith"]
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: flagsmith
      POSTGRES_USER: flagsmith
      POSTGRES_PASSWORD: password

  flagsmith-redis:
    profiles: ["flagsmith"]
    image: redis:6-alpine

  flagsmith:
    profiles: ["flagsmith"]
    image: flagsmith/flagsmith:latest
    depends_on:
      - flagsmith-postgres
      - flagsmith-redis
    environment:
      DATABASE_URL: postgresql://flagsmith:password@flagsmith-postgres:5432/flagsmith
      REDIS_URL: redis://flagsmith-redis:6379
      ALLOWED_HOSTS: '*'
      DJANGO_ALLOWED_HOSTS: '*'
      ACCESS_LOG_LOCATION: '/dev/null'
      DJANGO_SECRET_KEY: 'change-me'
      SERVER_URL: 'http://localhost:8000'
      ENABLE_ADMIN: 'True'
    ports:
      - "8000:8000"

  # --- Unleash -------------------------------------------------------------
  # NOTE: please do not use this configuration for production setups.
  # Intended for demo, development, and learning purposes only.
  # https://docs.getunleash.io/quickstart
  unleash:
    profiles: ["unleash"]
    image: unleashorg/unleash-server:latest
    ports:
      - "4242:4242"
    environment:
      DATABASE_URL: "postgres://postgres:unleash@unleash-db/db"
      DATABASE_SSL: "false"
      LOG_LEVEL: "warn"
      INIT_FRONTEND_API_TOKENS: "default:development.unleash-insecure-frontend-api-token"
      INIT_CLIENT_API_TOKENS: "default:development.unleash-insecure-api-token"
    depends_on:
      unleash-db:
        condition: service_healthy
    command: [ "node", "index.js" ]
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:4242/health || exit 1
      interval: 1s
      timeout: 1m
      retries: 5
      start_period: 15s

  unleash-db:
    profiles: ["unleash"]
    image: postgres:15
    expose:
      - "5432"
    environment:
      POSTGRES_DB: "db"
      POSTGRES_HOST_AUTH_METHOD: "trust"
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "--username=postgres",
          "--host=127.0.0.1",
          "--port=5432"
        ]
      interval: 2s
      timeout: 1m
      retries: 5
      start_period: 10s